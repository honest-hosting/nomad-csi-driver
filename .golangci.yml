version: "2"

linters:
  enable:
    - misspell
    - revive
  settings:
    revive:
      rules:
        - name: exported
  exclusions:
    rules:
      # Test helpers intentionally ignore some errors for brevity.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/honest-hosting/nomad-csi-driver
